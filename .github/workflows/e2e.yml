name: E2E

# 既存の Playwright E2E (e2e/*.spec.ts) を CI で回す。
# companion (スマホ WebView 設定 UI) を chromium で検証するだけなので
# simulator も xvfb も不要。dev server は playwright.config の webServer が自動起動する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium + OS deps)
        run: bunx playwright install --with-deps chromium
      - name: Run E2E
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
